name: deploy-frontend

# Monorepo frontend deploy (servosync4). Deployuje Cloudflare Worker `servosync2`
# (static assets iz out/) direktno iz servosync4 preko `wrangler deploy` — BEZ oslanjanja
# na Cloudflare Git-integraciju / GitHub App pristup org-u. Radi na istom self-hosted runneru
# kao backend deploy (docker + node container).
#
# Zahteva repo secret: CLOUDFLARE_API_TOKEN  (scope: Account > Workers Scripts > Edit;
# najlakše preko šablona "Edit Cloudflare Workers"). Account ID nije tajna → dole u env.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, servosync]
    # github.token mora da ČITA Actions runs (CI kapija); contents:read za checkout.
    permissions:
      contents: read
      actions: read
    steps:
      # Checkout je PRVI korak (pre CI kapije) jer guard ispod mora da diff-uje
      # istoriju; fetch-depth: 0 = pun klon (plitak klon nema BEFORE commit).
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # BRAVA 1 — zaštita fajlova koji drže staru 1.0 mobilnu živom.
      # Incident 21.07.2026: promena assets/worker konfiguracije oborila /m/* na
      # Next 404 → APK ljuska (skener, STT, push) mrtva za ceo pogon. Ova tri fajla
      # su jedini most 1.0 mobilne kroz same-origin /m proxy, pa se ne menjaju
      # slučajno: namerna izmena mora nositi marker [worker-change] u commit poruci.
      - name: Guard — zaštićeni fajlovi 1.0 mobilne
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PROTECTED="frontend/worker/index.ts frontend/wrangler.jsonc frontend/public/sw.js"

          # BEFORE zna da bude prazan (prvi push na granu), sve nule (novo ref)
          # ili commit koji ne postoji lokalno (force-push, rebase) → fallback SHA~1.
          if [ -z "$BEFORE" ] || grep -qE '^0+$' <<< "$BEFORE" || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if ! BEFORE="$(git rev-parse "${SHA}~1" 2>/dev/null)"; then
              echo "::notice::Nema prethodnog commita za poređenje (prvi commit?) — guard preskočen."
              exit 0
            fi
            echo "Fallback baza za diff: ${BEFORE}"
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$SHA" -- $PROTECTED)"

          if [ -z "$CHANGED" ]; then
            echo "Zaštićeni fajlovi netaknuti u ${BEFORE}..${SHA} — guard OK."
            exit 0
          fi

          echo "Izmenjeni zaštićeni fajlovi:"
          printf '  %s\n' $CHANGED

          # Poruke prvo u promenljivu, pa herestring: `git log | grep -q` bi pod
          # `pipefail` umeo da vrati 141 (SIGPIPE, grep izađe na prvom pogotku)
          # i tako LAŽNO oborio marker na velikim range-ovima.
          MSGS="$(git log --format=%B "${BEFORE}..${SHA}")"
          if grep -qF '[worker-change]' <<< "$MSGS"; then
            echo "::notice::Guard: namerna izmena zaštićenih fajlova ([worker-change] u commit poruci) — deploy sme dalje."
            exit 0
          fi

          echo "::error::DEPLOY BLOKIRAN — menjani su fajlovi koji drže staru 1.0 mobilnu živom:"
          for f in $CHANGED; do echo "::error::  - $f"; done
          echo "::error::Ovi fajlovi (worker/index.ts, wrangler.jsonc, public/sw.js) proksiraju /m, /m/*, /assets/*, /icons/*, /manifest.webmanifest na 1.0 (servoteh-plan-montaze.pages.dev)."
          echo "::error::Bez njih APK ljuska i nativni skener prestaju da rade za ceo pogon (incident 21.07.2026: /m/* je vraćao Next 404)."
          echo "::error::Ako je izmena NAMERNA: dodaj marker [worker-change] u commit poruku (npr. 'fix(worker): ... [worker-change]') i push-uj ponovo."
          echo "::error::Ako NIJE namerna: vrati te fajlove (git checkout origin/main -- <fajl>) pa push-uj."
          exit 1

      # CI kapija: deploy sme tek kad ci-backend za OVAJ isti SHA završi ZELENO.
      # Motiv: 24.07.2026 dva push-a sa crvenim ci-backend ipak stigla na prod
      # (deploy je zaseban workflow). Runner je self-hosted Linux (curl + jq postoje).
      # FE-only push (npr. ovaj) ne okida ci-backend — grace grana onda PROPUSTI (notice).
      - name: Wait for ci-backend (CI gate)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CI_NAME: ci-backend # name: polje iz ci-backend.yml — po njemu filtriramo run
        run: |
          set -euo pipefail

          # Najnoviji ci-backend run za ovaj SHA → "status conclusion url" ili "MISSING".
          latest_run() {
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
            | jq -r --arg n "$CI_NAME" \
                '[.workflow_runs[] | select(.name==$n)] | sort_by(.created_at) | last
                 | if . == null then "MISSING" else "\(.status) \(.conclusion) \(.html_url)" end'
          }

          # 1) Grace: ci-backend ide po paths (backend/**). FE-only/docs push nema run —
          #    čekaj do 3 min (poll 20s) da se pojavi, pa PROPUSTI ako ga i dalje nema.
          echo "Tražim ci-backend run za SHA ${SHA} ..."
          run="MISSING"
          for i in $(seq 1 9); do # 9 × 20s = 180s
            run="$(latest_run)"
            [ "$run" != "MISSING" ] && break
            echo "  run još nije viđen ($i/9) — čekam 20s ..."
            sleep 20
          done

          if [ "$run" = "MISSING" ]; then
            echo "::notice::ci-backend nije okinut za ovaj SHA (paths) — gate preskočen (FE-only/docs push)."
            exit 0
          fi

          # 2) Run postoji: poll 30s do 25 min na završetak.
          for i in $(seq 1 50); do # 50 × 30s = 1500s = 25 min
            set -- $run
            status="${1:-}"; concl="${2:-}"; url="${3:-}"
            if [ "$status" = "completed" ]; then
              case "$concl" in
                success)
                  echo "ci-backend ZELEN (success) — $url. Deploy sme dalje."; exit 0 ;;
                failure|cancelled|timed_out|action_required|startup_failure|stale)
                  echo "::error::ci-backend NIJE prošao (conclusion=$concl) — $url"
                  echo "::error::Deploy BLOKIRAN. Popravi CI pa re-run deploy (ci-backend na main/PR)."
                  exit 1 ;;
                *)
                  echo "::error::ci-backend conclusion=$concl (nepoznato) — $url. Blokiram iz opreza."; exit 1 ;;
              esac
            fi
            echo "  ci-backend još traje (status=$status, $i/50) — čekam 30s ..."
            sleep 30
            run="$(latest_run)"
          done

          echo "::error::ci-backend nije završio ni posle 25 min (i dalje traje) — blokiram deploy. Re-run kad CI završi."
          exit 1

      - name: Build & deploy (Cloudflare Worker servosync2)
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e2f616e00cb68d6485f93a6be4dfb14b
        run: |
          set -euo pipefail
          # Build (static export → out/) i deploy u node containeru — runner ima docker.
          # `npm run deploy` = `next build && wrangler deploy`; ovde eksplicitno da vidimo korake.
          docker run --rm \
            -u "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/.npm \
            -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID \
            -v "$PWD":/work -w /work node:22-bookworm-slim \
            sh -c "npm ci && npx next build && [ -d out ] && npx wrangler deploy"

      # BRAVA 2 — smoke posle deploy-a. FE pandan sekciji 6 iz
      # backend/scripts/post-deploy-verify.sh („MOBILNA 1.0 (/m/*)"): deploy koji
      # „uspe" a obori /m/* je tihi otkaz — golo /m ume da radi dok su PODRUTE mrtve.
      # Zato se proveravaju i podrute, i 3.0 login (da worker nije pojeo sve).
      - name: Smoke — 1.0 mobilna i 3.0 posle deploy-a
        run: |
          set -euo pipefail

          BASE="https://servosync.servoteh.com"
          FAIL=0

          # check <putanja> <marker> — do 6 pokušaja (10s pauza) da propusti CF propagaciju.
          # grep čita herestring (ne pipe): pod `pipefail` bi `printf | grep -q` na
          # velikom HTML-u umeo da vrati 141 (SIGPIPE) i lažno prijavi pad.
          # check <putanja> <marker>            — mora sadržati taj marker
          # check <putanja> -e <m1> <m2> ...    — dovoljan JEDAN od markera (ispisuje koji)
          check() {
            url="$1"; shift
            if [ "${1:-}" = "-e" ]; then shift; fi
            for i in $(seq 1 6); do
              if body="$(curl -fsS --max-time 15 -A 'Mozilla/5.0 (Android)' "$url" 2>/dev/null)"; then
                for m in "$@"; do
                  if grep -q "$m" <<< "$body"; then
                    echo "  OK  $url (marker: $m)"
                    return 0
                  fi
                done
              fi
              echo "  ... $url još ne odgovara očekivano ($i/6) — čekam 10s"
              sleep 10
            done
            echo "::error::SMOKE PAO: $url ne sadrži nijedan od markera [$*] ni posle 6 pokušaja."
            return 1
          }

          # /m rute moraju biti ŽIVE — ali od gašenja 1.0 (PR #95, `feat/cutover-1.0-gasenje`)
          # više ne serviraju staru aplikaciju nego preusmeravaju na 3.0 `/mob`. Postoji i
          # prekidač za povratak na 1.0, pa kapija prihvata OBA ispravna stanja i ispisuje
          # koje je zatekla; pada samo ako /m ne odgovara ili vrati prazno/404 — a to je
          # scenario zbog kog je kapija i uvedena (ceo pogon ostane bez mobilne).
          echo "/m rute (posle gašenja 1.0 vode na 3.0 /mob; prekidač može vratiti 1.0)"
          for p in /m /m/montaza /m/odrzavanje; do
            check "${BASE}${p}" -e 'Servosync V1.0' '_next' || FAIL=1
          done

          echo "3.0 aplikacija (marker: _next)"
          check "${BASE}/login" '_next' || FAIL=1

          if [ "$FAIL" != "0" ]; then
            echo "::error::DEPLOY JE DEFEKTAN — ne javljati „radi”."
            echo "::error::Ako su pale /m rute: mobilna je oborena za ceo pogon (bilo 1.0 kroz proxy, bilo 3.0 /mob posle gašenja)."
            echo "::error::OPORAVAK (odmah, ne čekati istragu):"
            echo "::error::  1) Cloudflare dashboard → Workers & Pages → servosync2 → Deployments → Rollback na prethodnu verziju, ILI"
            echo "::error::  2) git revert <ovaj SHA> + push na main (deploy se ponovo okine)."
            echo "::error::Sama 1.0 je NETAKNUTA i direktno živi na https://servoteh-plan-montaze.pages.dev."
            echo "::error::Provera posle oporavka: ssh ubuntusrv 'bash -s' < backend/scripts/post-deploy-verify.sh (sekcija 6)."
            exit 1
          fi

          echo "🟢 SMOKE OK — /m rute žive i 3.0 (/login) živa."
