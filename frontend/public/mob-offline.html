<!doctype html>
<html lang="sr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nema veze sa mrežom · ServoSync 3.0</title>
    <!--
      Offline ekran instalirane 3.0 mobilne aplikacije. Servira ga `public/mob-sw.js`
      kad navigacija pod `/mob` ne prođe ni na mrežu ni iz keša.

      • SAM ZA SEBE: bez fontova, slika, JS bundle-a i CSS fajla — u trenutku kad se
        prikazuje, mreže nema, pa svaka spoljna referenca ostaje prazan pravougaonik.
      • Boje su DOSLOVNE KOPIJE tokena (`src/styles/tokens.css`: --bg/--surface/--ink/
        --ink-secondary/--line/--accent, svetla i tamna varijanta) — statički HTML ne
        može da čita CSS promenljive aplikacije. Isti izuzetak kao `themeColor` u
        `app/layout.tsx` (DESIGN_SYSTEM §3): menjaju se ZAJEDNO sa tokenom.
      • Putanja `/mob-offline` je pod scope-om `/mob` (prefiks!) — zato ostaje UNUTAR
        instalirane aplikacije. `/offline.html` bi bio van scope-a i na iOS-u bi ispao
        u Safari.
      • 🔴 SW mu prilazi BEZ `.html`: Cloudflare Pages („clean URLs") na
        `/mob-offline.html` vraća 307 na `/mob-offline`, a keširan odgovor dobijen kroz
        preusmerenje pregledač ODBIJA na navigaciji („Response served by service worker
        has redirections") — offline ekran bi pao baš kad zatreba. Fajl zato ostaje ovde
        pod svojim imenom, ali se u `mob-sw.js` piše kao `/mob-offline`.
    -->
    <style>
      :root {
        --bg: #f7f9f9;
        --surface: #ffffff;
        --ink: #22282c;
        --ink-secondary: #79878e;
        --line: #e3e8e8;
        --accent: #0d9488;
        --accent-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a1116;
          --surface: #111c22;
          --ink: #e6eef1;
          --ink-secondary: #93a4ac;
          --line: #24343d;
          --accent: #2dd4bf;
          --accent-fg: #04231e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .kartica {
        width: 100%;
        max-width: 22rem;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px; /* --radius-panel */
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--ink-secondary);
      }
      button {
        width: 100%;
        min-height: 44px; /* meta ≥44px (DESIGN_SYSTEM §11) */
        border: 0;
        border-radius: 7px; /* --radius-control */
        background: var(--accent);
        color: var(--accent-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      /* Ikona je INLINE SVG (lucide „wifi-off", isti skup kao ostatak aplikacije) —
         emoji je zabranjen u UI (DESIGN_SYSTEM §2), a <img> bi bez mreže bio prazan. */
      .znak {
        color: var(--ink-secondary);
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main class="kartica">
      <div class="znak" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>Nema veze sa mrežom</h1>
      <p>
        Ekran nije mogao da se učita jer telefon trenutno nema vezu sa serverom.
        Proveri Wi‑Fi ili mobilne podatke pa pokušaj ponovo — uneti podaci koji nisu
        poslati ostaju na uređaju.
      </p>
      <button type="button" onclick="location.reload()">Pokušaj ponovo</button>
    </main>
  </body>
</html>
